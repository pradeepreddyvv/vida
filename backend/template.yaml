AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Vida AI Life Assistant

Parameters:
  TableName:
    Type: String
    Default: vida-main
  DocsBucketName:
    Type: String
    Default: vida-docsbucket-xblspyo8z9xs

Globals:
  Function:
    Runtime: python3.11
    Architectures: [arm64]
    Environment:
      Variables:
        TABLE_NAME: !Ref VidaTable
        DOCS_BUCKET: !Ref DocsBucketName
        REGION: !Ref AWS::Region

Resources:

  # ─── DynamoDB ─────────────────────────────────────────────────

  VidaTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI3
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ─── Lambda: vida-api (public, all HTTP routes) ───────────────

  VidaApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: vida-api
      Handler: api.handler.handler
      CodeUri: functions/
      MemorySize: 256
      Timeout: 29
      Environment:
        Variables:
          AI_FUNCTION_NAME: !Ref VidaAiFunction
          BEDROCK_MODEL_ID: amazon.nova-lite-v1:0
          GOOGLE_CLIENT_ID: ""
          GOOGLE_CLIENT_SECRET: ""
          NOTION_CLIENT_ID: ""
          NOTION_CLIENT_SECRET: ""
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VidaTable
        - S3CrudPolicy:
            BucketName: !Ref DocsBucketName
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt VidaAiFunction.Arn
        - Statement:
            - Effect: Allow
              Action:
                - polly:SynthesizeSpeech
                - transcribe:StartStreamTranscription
              Resource: "*"
      Events:
        CatchAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref VidaHttpApi
            Path: /api/{proxy+}
            Method: ANY

  # ─── Lambda: vida-ai (internal async worker, no HTTP) ─────────

  VidaAiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: vida-ai
      Handler: ai.handler.handler
      CodeUri: functions/
      MemorySize: 512
      Timeout: 90
      Environment:
        Variables:
          BEDROCK_MODEL_ID: amazon.nova-lite-v1:0
          BEDROCK_KB_ID: "PLACEHOLDER_SET_AFTER_KB_CREATION"
          GOOGLE_CLIENT_ID: ""
          GOOGLE_CLIENT_SECRET: ""
          NOTION_CLIENT_ID: ""
          NOTION_CLIENT_SECRET: ""
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VidaTable
        - S3CrudPolicy:
            BucketName: !Ref DocsBucketName
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "arn:aws:bedrock:*::foundation-model/*"
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:Retrieve
                - bedrock:StartIngestionJob
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
        - Statement:
            - Effect: Allow
              Action:
                - polly:SynthesizeSpeech
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - transcribe:StartStreamTranscription
              Resource: "*"

  # ─── API Gateway (HTTP API) ───────────────────────────────────

  VidaHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-User-Id
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]

Outputs:
  ApiUrl:
    Description: API Gateway endpoint
    Value: !Sub "https://${VidaHttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  AiFunctionName:
    Description: AI worker Lambda function name
    Value: !Ref VidaAiFunction
